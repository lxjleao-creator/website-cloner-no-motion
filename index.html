<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tervona</title>
    <script>
      (() => {
        const repositoryPath = "/website-cloner-no-motion";
        const usesRepositoryPath = window.location.hostname.endsWith(".github.io")
          || window.location.pathname === repositoryPath
          || window.location.pathname.startsWith(`${repositoryPath}/`);
        window.__SITE_BASE_PATH__ = usesRepositoryPath ? repositoryPath : "";
        const base = document.createElement("base");
        base.href = `${window.location.origin}${window.__SITE_BASE_PATH__ || ""}/`;
        document.head.appendChild(base);
      })();
    </script>
    <link rel="icon" type="image/png" href="assets/tervona-logo-transparent.png" />
