<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Tervona Marketing OS</title>
  <link rel="stylesheet" href="/marketing-os/styles.css?v=20260811-1">
  <script defer src="/marketing-os/app.js?v=20260811-1"></script>
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24"><path d="m12 3 1.2 3.8L17 8l-3.8 1.2L12 13l-1.2-3.8L7 8l3.8-1.2L12 3Z"/><path d="m5 14 .9 2.6L8.5 18l-2.6.9L5 21l-.9-2.1L2 18l2.1-1.4L5 14Z"/><path d="m19 12 .8 2.2L22 15l-2.2.8L19 18l-.8-2.2L16 15l2.2-.8L19 12Z"/></symbol>
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 6.5h6l2 2h10v10.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5Z"/><path d="M3 10h18"/></symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></symbol>
    <symbol id="icon-trend" viewBox="0 0 24 24"><path d="M3 19 9 13l4 4 8-10"/><path d="M15 7h6v6"/></symbol>
    <symbol id="icon-megaphone" viewBox="0 0 24 24"><path d="m3 11 16-6v14L3 13v-2Z"/><path d="M7 14v5a2 2 0 0 0 2 2h2v-5"/></symbol>
    <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.4 8 8 9 4.6-1 8-4 8-9V6l-8-3Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></symbol>
    <symbol id="icon-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/></symbol>
    <symbol id="icon-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M17 11a3.5 3.5 0 0 0 0-7M21 21v-2a4 4 0 0 0-3-3.8"/></symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="icon-log-out" viewBox="0 0 24 24"><path d="M10 17l5-5-5-5M15 12H3M15 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/></symbol>
    <symbol id="icon-box" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"/><path d="m4.5 7.8 7.5 4.3 7.5-4.3M12 12v9"/></symbol>
    <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6V3Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
    <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.2 1.2"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.2-1.2"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/></symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main id="login-view" class="login-view" hidden>
    <section class="login-panel" aria-labelledby="login-title">
      <img src="/assets/tervona-logo-transparent.png" alt="Tervona" class="login-logo">
      <p>Tervona Marketing OS</p>
      <h1 id="login-title">登录客户控制台</h1>
      <form id="login-form">
        <label>账号<input name="username" autocomplete="username" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit" class="button button-primary button-block">登录</button>
        <p id="login-error" class="form-error" role="alert"></p>
      </form>
    </section>
  </main>

  <div id="console-shell" class="console-shell" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="/assets/tervona-logo-transparent.png" alt="Tervona">
        <span>Tervona Marketing OS</span>
      </div>
      <nav id="primary-nav" aria-label="主导航"></nav>
      <div class="sidebar-footer">
        <a href="/" target="_blank" rel="noopener">查看网站 <span aria-hidden="true">↗</span></a>
      </div>
    </aside>
    <button id="mobile-nav-backdrop" class="mobile-nav-backdrop" type="button" aria-label="关闭导航" hidden></button>

    <section class="workspace">
      <header class="topbar">
        <button id="mobile-menu" class="icon-button mobile-menu" type="button" aria-label="打开导航" aria-expanded="false"><svg><use href="#icon-menu"/></svg></button>
        <h1 id="page-title">运营总览</h1>
        <div class="topbar-actions">
          <button class="workspace-button" type="button"><span class="workspace-mark">T</span>Tervona <span aria-hidden="true">⌄</span></button>
          <button class="icon-button" type="button" aria-label="通知"><svg><use href="#icon-bell"/></svg></button>
          <button id="user-menu-button" class="user-button" type="button" aria-expanded="false"><span id="user-avatar">T</span><span id="user-name">Tervona</span><span aria-hidden="true">⌄</span></button>
          <div id="user-menu" class="user-menu" hidden>
            <p id="user-role"></p>
            <button id="logout-button" type="button"><svg><use href="#icon-log-out"/></svg>退出登录</button>
          </div>
        </div>
      </header>
      <div id="page-content" class="page-content" tabindex="-1"></div>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header><div><h2 id="modal-title"></h2><p id="modal-description"></p></div><button type="button" class="icon-button" data-close-modal aria-label="关闭"><svg><use href="#icon-close"/></svg></button></header>
      <div id="modal-body"></div>
    </section>
  </div>
</body>
</html>
